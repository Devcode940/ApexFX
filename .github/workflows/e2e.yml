name: E2E (real browser)
# Deliberately separate from CI: browser downloads are heavy and occasionally flaky.
# Flip continue-on-error to false once the job has gone green on main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
